name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: build-test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: git config --global user.name "ci" && git config --global user.email "ci@example.com"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build && pnpm test

  # Extension-host test: downloads VS Code, so it is not part of the default `pnpm test` (DECISIONS #8).
  vscode:
    runs-on: ubuntu-latest
    env:
      VSCODE_TEST_VERSION: "1.143.1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: git config --global user.name "ci" && git config --global user.email "ci@example.com"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: packages/vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}
      - name: Install VS Code runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      # The harness builds the demo repo itself (it runs examples/demo-repo.sh with a `prov` shim on PATH).
      - run: xvfb-run -a pnpm --filter provenance-vscode test:vscode
